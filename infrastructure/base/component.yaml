# The base: always installed. Certificates, storage, and the cluster-wide settings in chart/. Its
# settings are the shared ones in site.yaml (acmeEmail, acme, timezone, network, nas, backup, lvm),
# which scripts/configure.py asks itself. Fields: README "Components and apps".
description: cert-manager, OpenEBS LVM LocalPV, ClusterIssuers, the StorageClass lvm, Traefik settings
repositories:
  jetstack: https://charts.jetstack.io
  sintef: https://sintef.github.io/cert-manager-webhook-gandi
  openebs-lvm: https://openebs.github.io/lvm-localpv
releases:
  # First: its CRDs back the ClusterIssuers and every Certificate.
  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.21.2
  - name: cert-manager-webhook-gandi
    namespace: cert-manager
    chart: sintef/cert-manager-webhook-gandi
    version: v0.6.0
    needs: [cert-manager/cert-manager]
    when: gandiSolver
  - name: lvm-localpv
    namespace: openebs
    chart: openebs-lvm/lvm-localpv
    version: 1.10.1
  # The ClusterIssuers (with the Gandi PAT's Secret), the StorageClass lvm, Traefik's settings.
  - name: cluster
    namespace: kube-system
    chart: ./chart
    site: secrets
    needs: [cert-manager/cert-manager, cert-manager/cert-manager-webhook-gandi, openebs/lvm-localpv]
