# Defaults for release monitoring. grafana.hostname, network.lanCidr and the Discord webhook come
# from the site directory (README "Components and apps").

# ClusterIssuer for the Ingress certificate (infrastructure/base/chart, issuers).
certIssuer: letsencrypt-prod

# Grafana's Service, created by release kube-prometheus-stack.
grafanaService:
  name: kube-prometheus-stack-grafana
  port: 80

# The Secret holding the Discord webhook URL. Alertmanager mounts it and reads the key as a file:
# both must match infrastructure/monitoring/kube-prometheus-stack.yaml (alertmanagerSpec.secrets,
# webhook_url_file).
discordSecret:
  name: alertmanager-discord
  key: webhook-url
