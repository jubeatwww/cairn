# Traefik routes by Host header alone, so a host whose DNS points at a LAN IP is still reachable
# through the public IP. Every LAN-only Ingress in this namespace attaches it with:
#   traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-lan-only@kubernetescrd
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: {{ .Release.Namespace }}
spec:
  ipAllowList:
    sourceRange:
      - {{ required "network.lanCidr is required (site.yaml)" .Values.network.lanCidr }}
