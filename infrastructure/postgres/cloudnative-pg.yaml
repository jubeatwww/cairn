# https://github.com/cloudnative-pg/charts/tree/main/charts/cloudnative-pg
# The CloudNativePG operator, watching every namespace. Each app's Postgres cluster comes from
# charts/postgres-cluster.

monitoring:
  # CloudNativePG's dashboard, loaded by Grafana's sidecar (infrastructure/monitoring), which
  # picks up ConfigMaps labelled grafana_dashboard: "1" in any namespace.
  grafanaDashboard:
    create: true
