# On with infrastructure.postgres in site.yaml. Each app with a database gets its own cluster from
# charts/postgres-cluster. Fields: README "Components and apps".
description: CloudNativePG, for the apps' Postgres clusters
repositories:
  cnpg: https://cloudnative-pg.github.io/charts
releases:
  - name: cloudnative-pg
    namespace: cnpg-system
    chart: cnpg/cloudnative-pg
    version: 0.29.1
    # The PodMonitor CRD for its dashboard, when monitoring is on.
    needs: [kube-system/cluster, monitoring/kube-prometheus-stack]
