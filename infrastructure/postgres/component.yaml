# site.yaml: infrastructure.postgres. Fields: infrastructure/base/component.yaml and
# infrastructure/monitoring/component.yaml. Each app with a database (apps.<name>.database) gets its
# own cluster from charts/postgres-cluster.
description: CloudNativePG, for the apps' Postgres clusters
repositories:
  cnpg: https://cloudnative-pg.github.io/charts
releases:
  - name: cloudnative-pg
    namespace: cnpg-system
    chart: cnpg/cloudnative-pg
    version: 0.29.1
    # The PodMonitor CRD for its dashboard, when monitoring is on.
    needs: [kube-system/cluster, monitoring/kube-prometheus-stack]
