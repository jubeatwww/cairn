# https://github.com/grafana/loki/tree/main/production/helm/loki
# Single binary on the node's disk: one process, no object storage. Plenty for one node's logs.
# Logs arrive from helm/alloy; Grafana reads them at http://loki.monitoring.svc.cluster.local:3100.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 336h  # 14 days
    # A pod stuck in a log loop must not fill the volume: past this rate Alloy's pushes get 429
    # and it retries later. Normal traffic is a few KB/s.
    ingestion_rate_mb: 0.1
    ingestion_burst_size_mb: 1
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    # Capped at its size (charts/cluster, lvmStorageClass). A StatefulSet can't change its
    # volumes in place: changing the class means deleting the StatefulSet and the PVC.
    storageClass: lvm
    size: 10Gi

# The other deployment modes' components, caches and helpers: not needed for a single binary.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
