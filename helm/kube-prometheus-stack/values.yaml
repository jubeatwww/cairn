# https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
# Prometheus, Alertmanager, Grafana, node-exporter and kube-state-metrics.
# Grafana's Ingress lives in charts/monitoring, with the hostname from site.yaml.

# k3s runs etcd, the scheduler, the controller-manager and kube-proxy inside the k3s process and
# doesn't expose their metrics. Scraping them would only raise "target down" alerts.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
    windows: false

prometheus:
  prometheusSpec:
    retention: 15d
    # Stop well before the volume fills up: past its size, writes fail.
    retentionSize: 18GB
    # Pick up ServiceMonitors, PodMonitors, Probes, ScrapeConfigs and rules from every namespace,
    # not only the ones labelled for this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          # Capped at its size (charts/cluster, lvmStorageClass). A StatefulSet can't change its
          # volumes in place: changing the class means deleting the StatefulSet and the PVC.
          storageClassName: lvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

alertmanager:
  # Merged into the chart's default config, which keeps its grouping (by namespace), its
  # inhibit rules, and repeating a firing alert every 12h.
  config:
    route:
      receiver: discord
      routes:
        # Always firing, to prove the alerting pipeline works. Nothing to tell anyone.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          # The Secret from charts/monitoring (discordSecret), mounted through alertmanagerSpec.secrets.
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            # Shorter than the default, which lists every label of every alert.
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ len .Alerts.Firing }}{{ end }}] {{ .CommonLabels.alertname }}{{ with .GroupLabels.namespace }} · {{ . }}{{ end }}'
            message: |-
              {{ range .Alerts }}{{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }} **{{ .Labels.alertname }}**{{ with .Labels.severity }} ({{ . }}){{ end }}
              {{ with .Annotations.description }}{{ . }}{{ else }}{{ .Annotations.summary }}{{ end }}
              {{ end }}
  alertmanagerSpec:
    secrets:
      - alertmanager-discord

grafana:
  # The admin password is generated on first install and kept in the Secret
  # kube-prometheus-stack-grafana (key admin-password).
  defaultDashboardsTimezone: browser
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
    annotations:
      helm.sh/resource-policy: keep
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      # helm/loki: single binary, no gateway.
      url: http://loki.monitoring.svc.cluster.local:3100
