# Copy to site.secret.yaml next to site.yaml (gitignored in the repo root) and fill in, or let
# scripts/setup-gandi-dns01.sh and scripts/setup-discord-alerts.sh write it.
gandi:
  # Only when a zone uses the gandi solver. Personal Access Token with "Manage domain name technical
  # configurations", scoped to your domains.
  pat: "<GANDI_PERSONAL_ACCESS_TOKEN>"
discord:
  # Only with infrastructure.monitoring. Alertmanager posts alerts here.
  # Channel settings > Integrations > Webhooks; scripts/setup-discord-alerts.sh writes it.
  webhookUrl: "https://discord.com/api/webhooks/<id>/<token>"
# Per app: merged over its entry in site.yaml, for that app only. charts/app turns secrets into the
# Secret <name>-secrets. Any value here can be a reference instead, e.g. ref+sops://... (README "Secrets").
apps:
  notes:
    secrets:
      sessionKey: "<random>"
