# Copy to site.secret.yaml next to site.yaml (gitignored in the repo root) and fill in, or write one
# key at a time with scripts/secret.py set <key>, which checks the ones below with their services.
# Any value can be a reference instead, e.g. ref+sops://... (README "Secrets").
gandi:
  # Only when a zone uses the gandi solver. Personal Access Token with "Manage domain name technical
  # configurations", scoped to your domains.
  pat: "<GANDI_PERSONAL_ACCESS_TOKEN>"
discord:
  # Only with infrastructure.monitoring. Alertmanager posts alerts here.
  # Channel settings > Integrations > Webhooks > New Webhook > Copy Webhook URL.
  webhookUrl: "https://discord.com/api/webhooks/<id>/<token>"
# Per app: merged over its entry in site.yaml, for that app only. charts/app turns secrets into the
# Secret <name>-secrets.
apps:
  aetherium:
    ghcr:
      # Classic PAT with read:packages only.
      token: "<GHCR_READ_PACKAGES_PAT>"
    sinotrade:
      id: "<SINOTRADE_ID>"
      password: "<SINOTRADE_PASSWORD>"
      # Shioaji API key pair, for amt-futures.
      apiKey: "<SHIOAJI_API_KEY>"
      secretKey: "<SHIOAJI_SECRET_KEY>"
    # The whole file: scripts/secret.py set apps.aetherium.twcaLocalStorage < twca-local-storage.json
    twcaLocalStorage: "<TWCA_LOCAL_STORAGE_JSON>"
  notes:
    secrets:
      sessionKey: "<random>"
