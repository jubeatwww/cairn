# Copy to site.secret.yaml (gitignored) and fill in, or let scripts/setup-gandi-dns01.sh and
# scripts/setup-discord-alerts.sh write it.
gandi:
  # Personal Access Token with "Manage domain name technical configurations", scoped to your domains.
  pat: "<GANDI_PERSONAL_ACCESS_TOKEN>"
discord:
  # Alertmanager posts alerts here. Channel settings > Integrations > Webhooks; scripts/setup-discord-alerts.sh writes it.
  webhookUrl: "https://discord.com/api/webhooks/<id>/<token>"
