# LAN-only: {{ include "home.haHost" . }} resolves to {{ .Values.network.nodeIp }}, and lan-only blocks anything else.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.certIssuer }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ include "home.lanOnly" . }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ include "home.haHost" . }}
      secretName: home-assistant-tls
  rules:
    - host: {{ include "home.haHost" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  name: http
