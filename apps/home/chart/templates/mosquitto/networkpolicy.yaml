# The broker allows anonymous clients, so only these may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mosquitto
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - zigbee2mqtt
                  - home-assistant
        # Home Assistant runs with hostNetwork, so its traffic comes from the node: its LAN IP,
        # or cni0's address when kube-proxy masquerades.
        - ipBlock:
            cidr: {{ required "network.nodeIp is required (site.yaml)" .Values.network.nodeIp }}/32
        - ipBlock:
            cidr: {{ required "network.podGateway is required (site.yaml)" .Values.network.podGateway }}/32
      ports:
        - protocol: TCP
          port: 1883
