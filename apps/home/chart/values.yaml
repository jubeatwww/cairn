# Defaults for home: versions and sizes. Its settings (hostname, zigbee) come from apps.home in
# site.yaml, which can override these too (README "Components and apps"). Bump an image here, then
# run helmfile apply.
images:
  homeAssistant: ghcr.io/home-assistant/home-assistant:2026.9.4
  zigbee2mqtt: ghcr.io/koenkk/zigbee2mqtt:2.14.2
  mosquitto: eclipse-mosquitto:2.0.22

# ClusterIssuer for the Ingress certificates (infrastructure/base/chart, issuers).
certIssuer: letsencrypt-prod

# Requested sizes for the local-path volumes (local-path doesn't enforce them). Backed up every
# night (apps/home/app.yaml, backup).
storage:
  homeAssistant: 5Gi
  zigbee2mqtt: 1Gi
