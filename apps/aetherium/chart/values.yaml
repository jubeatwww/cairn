# Defaults for aetherium. Its settings (archivePath) come from apps.aetherium in site.yaml, and its
# secrets (ghcr.token, sinotrade, fubon, twcaLocalStorage) from its section of site.secret.yaml;
# either can override these too (README "Components and apps").
images:
  # market-tap's two images, built from its repo and pushed by hand, pulled again on every start
  # (imagePullPolicy): amt runs the server, amt-login the Job the server starts every trading
  # morning to sign in (node and Chromium). amt has a version tag since it hands its quotes to
  # amt-collector (market-tap's P3), so a rebuild can't change that unannounced; amt-login's is
  # still moving.
  amt: ghcr.io/jubeatwww/amt:0.2.0
  amtLogin: ghcr.io/jubeatwww/amt-login:latest
  # amt-providers, the sources on the brokers' APIs (market-tap's providers/), one command each:
  # amt-futures and amt-stock-trades run it. A version tag, pulled once (pinnedImagePullPolicy):
  # amt-futures restarts itself every morning, and mustn't pick up an unreviewed build then;
  # upgrading is changing this tag.
  amtProviders: ghcr.io/jubeatwww/amt-providers:0.4.1
  # amt-collector, the one writer of market_trades and market_quotes (market-tap's collector/): a
  # version tag too.
  amtCollector: ghcr.io/jubeatwww/amt-collector:0.2.0
  # The ClickHouse schema and kbar-tick-agg send SQL over HTTP.
  curl: curlimages/curl:8.22.0
  # replay-segments; its packages are pinned in its CronJob.
  python: python:3.11.16-slim-trixie
imagePullPolicy: Always
# The images with a version tag (amt-providers, amt-collector): a tag is never pushed again.
pinnedImagePullPolicy: IfNotPresent

# amt-collector refuses a ReplaceUnits call of more rows than this (RESOURCE_EXHAUSTED; its own
# default is two million), so that one fits in resources.collector.
collectorMaxReplaceRows: 500000

# Pulls the private images (Secret ghcr-pull). token: site.secret.yaml.
ghcr:
  username: jubeatwww
  token: ""

# The server's working directory: each day's quotes as they're collected, until they're uploaded
# to ClickHouse. Only uploads that keep failing make it grow; lvm caps it.
storage:
  data:
    size: 10Gi
    storageClass: lvm
  # amt-futures' /state: the batches amt-collector hasn't taken yet (its outbox, which only grows
  # while the collector is unreachable), its login count, the SDK's log and token pool.
  futures:
    size: 5Gi
    storageClass: lvm
  # amt-collector's /state: its write-ahead log, the stream it acknowledged that isn't in ClickHouse
  # yet. It only grows while ClickHouse is down.
  collector:
    size: 5Gi
    storageClass: lvm

resources:
  # The server peaks around 600Mi during a session.
  server:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Three contracts: a small Python process. Batches the collector hasn't taken go to disk, not
  # memory.
  futures:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # A ReplaceUnits call holds its rows in memory. The largest a provider sends is one futures
  # product's day from Shioaji's history (about 260,000 rows on a busy day) or 200,000 stock trades
  # (Fubon's, and amt-server's from MoneyDJ, both after the session); collectorMaxReplaceRows refuses
  # a bigger call before it runs out of memory. At 512Mi one call of Fubon's got it killed
  # (2026-10-28). The limit keeps the node's total within its memory.
  collector:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi
  # It sends the collector 200,000 rows at a time, about 2Ki each in Python: at 512Mi it was killed
  # before its first call, at some 190,000 rows (2026-10-28).
  stockTrades:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  replaySegments:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# The CronJobs, in UTC: Taiwan is UTC+8, with no daylight saving time.
schedules:
  # 06:40 Taiwan time, after the 06:00 upload of the night session: the last three days of
  # tick_futures, aggregated again into kbar_1m.
  kbarTickAgg: "40 22 * * *"
  # 06:50 Taiwan time, after kbar-tick-agg: amt.replay_segments, the replayable sessions.
  replaySegments: "50 22 * * *"
  # 14:40, 17:40 and 20:40 Taiwan time on weekdays: amt-stock-trades' three passes, once Fubon has
  # the 14:30 closing auction.
  stockTrades: "40 6,9,12 * * 1-5"

# ConfigMap amt-trading-calendar's first content: the weekdays the market is closed (holidays, make-up
# days, settlement-only days), from TWSE's schedule (openapi.twse.com.tw/v1/holidaySchedule/
# holidaySchedule). It's written once, then edited in the cluster: a typhoon day is decided that
# morning, next year's list in December (README "Aetherium").
holidays:
  - "2026-01-01"
  - "2026-02-12"
  - "2026-02-13"
  - "2026-02-16"
  - "2026-02-17"
  - "2026-02-18"
  - "2026-02-19"
  - "2026-02-20"
  - "2026-02-27"
  - "2026-04-03"
  - "2026-04-06"
  - "2026-05-01"
  - "2026-06-19"
  - "2026-09-25"
  - "2026-09-28"
  - "2026-10-09"
  - "2026-10-26"
  - "2026-12-25"
