# Every morning, after the night session: the last three days of tick_futures (the view across the
# 2026-10-23 cutover, files/clickhouse/16-tick_futures.sql) aggregated again into kbar_1m (source
# tick_agg). ReplacingMergeTree, and the overlapping window makes it idempotent: a day not fully
# collected gets partial bars, replaced the next morning — so does a night session read from the
# stream before the 14:05 backfill from Shioaji's history. Readers use kbar_1m_canonical
# (files/clickhouse/).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kbar-tick-agg
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.schedules.kbarTickAgg | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: agg
              image: {{ .Values.images.curl }}
              env:
                {{- include "aetherium.clickhouseEnv" . | nindent 16 }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  {{- include "aetherium.curlAuth" . | nindent 18 }}
                  # Retried: a new pod's first connections are dropped for a few seconds, until k3s
                  # adds it to the server's NetworkPolicy. The INSERT is safe to repeat.
                  curl -sS --fail-with-body --connect-timeout 5 --retry 5 --retry-connrefused --retry-delay 2 \
                    -K /tmp/curlrc "$CLICKHOUSE_URL/?database=$CLICKHOUSE_DB" --data-binary "
                  INSERT INTO kbar_1m (ts, symbol, source, open, high, low, close, volume, amount)
                  SELECT
                      toStartOfMinute(ts) + INTERVAL 1 MINUTE AS bar_ts,
                      transform(symbol, ['FITXN*1.TF','FIMTXN*1.TF','FITMN*1.TF'], ['TXFR1','MXFR1','TMFR1'], '') AS sym,
                      'tick_agg' AS source,
                      argMin(price, (ts, seq)) / 100 AS o,
                      max(price) / 100 AS h,
                      min(price) / 100 AS l,
                      argMax(price, (ts, seq)) / 100 AS c,
                      toUInt32(sum(volume)) AS v,
                      sum(price / 100 * volume) AS amt
                  FROM tick_futures
                  WHERE symbol IN ('FITXN*1.TF', 'FIMTXN*1.TF', 'FITMN*1.TF')
                    AND ts >= now() - INTERVAL 3 DAY
                  GROUP BY sym, bar_ts"
