apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: amt-collector-state
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.collector.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage.collector.size }}
