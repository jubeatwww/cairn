# amt-collector: the one writer of market_trades and market_quotes (files/clickhouse/15a, 15b). The
# providers hand it their quotes over gRPC (market-tap's proto/market.proto): a stream with Append,
# acknowledged once the batch is in its write-ahead log on /state, and a source's complete
# post-session data with ReplaceUnits, which replaces each unit (a symbol's day) whole. Design:
# market-tap's docs/collector-design.md.
#
# Recreate and one replica: replacing a unit is serialized by a lock in the process, and one process
# writes the log. It doesn't create the tables, only checks their columns. The grace period lets it
# write the log out to ClickHouse; what it can't stays on the volume until it starts again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amt-collector
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: amt-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amt-collector
    spec:
      # It never calls the Kubernetes API.
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: collector
          image: {{ .Values.images.amtCollector }}
          imagePullPolicy: {{ .Values.pinnedImagePullPolicy }}
          env:
            {{- include "aetherium.clickhouseEnv" . | nindent 12 }}
            - name: AMT_COLLECTOR_MAX_REPLACE_ROWS
              value: {{ .Values.collectorMaxReplaceRows | quote }}
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9092
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.collector | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The write-ahead log, /state/wal.
            - name: state
              mountPath: /state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: amt-collector-state
