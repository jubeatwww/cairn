# amt-stock-trades: the day's trades of every common stock from Fubon's Neo API, handed to
# amt-collector (ReplaceUnits) as market_trades with source 'fubon'. Design: market-tap's
# docs/collector-design.md.
#
# Three passes a trading day (schedules.stockTrades): Fubon serves today's trades only, complete once
# the 14:30 closing auction is in. Each pass skips the symbols already written, so the later ones
# only finish what the earlier left; on a holiday Fubon serves the previous trading day, done
# already. A pass starting after 20:00 Taiwan time exits 1 with symbols left, as does any pass that
# can't run at all (the login, the collector); a failed pass isn't retried, the next one is. It
# asks amt-collector what's written (UnitCounts) and keeps nothing itself, so it needs no volume.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: amt-stock-trades
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.schedules.stockTrades | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  # A pass more than 15 minutes late leaves it to the next.
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # Over before the next pass, three hours later; running out counts as failed.
      activeDeadlineSeconds: 10200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: amt-stock-trades
        spec:
          restartPolicy: Never
          # It never calls the Kubernetes API.
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: stock-trades
              image: {{ .Values.images.amtProviders }}
              imagePullPolicy: {{ .Values.pinnedImagePullPolicy }}
              args: [fubon-stock-trades, run]
              env:
                - name: AMT_COLLECTOR_ADDR
                  value: amt-collector:50051
                - name: FUBON_CERT_PATH
                  value: /secrets/fubon/cert.pfx
                {{- range $var := list "FUBON_ID" "FUBON_API_KEY" "FUBON_CERT_PASSWORD" }}
                - name: {{ $var }}
                  valueFrom:
                    secretKeyRef:
                      name: fubon-api
                      key: {{ $var }}
                {{- end }}
              resources:
                {{- toYaml .Values.resources.stockTrades | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: cert
                  mountPath: /secrets/fubon
                  readOnly: true
          volumes:
            - name: cert
              secret:
                secretName: fubon-api
                defaultMode: 0440
                items:
                  - key: cert.pfx
                    path: cert.pfx
