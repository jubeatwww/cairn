# The Fubon Neo API login amt-stock-trades signs in with (site.secret.yaml): the ID, an API key with
# market data permission only, and the certificate with its password. The certificate is valid for
# a year: replace fubon.cert and fubon.certPassword before it expires. Each pass reads it anew.
apiVersion: v1
kind: Secret
metadata:
  name: fubon-api
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  FUBON_ID: {{ .Values.fubon.id | quote }}
  FUBON_API_KEY: {{ .Values.fubon.apiKey | quote }}
  FUBON_CERT_PASSWORD: {{ .Values.fubon.certPassword | quote }}
data:
  # The .pfx, base64 in site.secret.yaml (line breaks dropped).
  cert.pfx: {{ .Values.fubon.cert | nospace | quote }}
