# The Shioaji API key pair amt-futures and amt-sinopac-stock-trades sign in with (site.secret.yaml), as
# their environment.
apiVersion: v1
kind: Secret
metadata:
  name: sj-api
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  SJ_API_KEY: {{ .Values.sinotrade.apiKey | quote }}
  SJ_SECRET_KEY: {{ .Values.sinotrade.secretKey | quote }}
