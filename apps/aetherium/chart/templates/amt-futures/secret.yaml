# The Shioaji API key pair amt-futures signs in with (site.secret.yaml), as its environment.
apiVersion: v1
kind: Secret
metadata:
  name: sj-api
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  SJ_API_KEY: {{ .Values.sinotrade.apiKey | quote }}
  SJ_SECRET_KEY: {{ .Values.sinotrade.secretKey | quote }}
