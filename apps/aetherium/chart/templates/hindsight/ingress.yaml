# LAN-only: {{ include "aetherium.hindsightHost" . }} resolves to the node's LAN IP, and lan-only blocks anything else.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hindsight
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.certIssuer }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ include "aetherium.hindsightHost" . }}
      secretName: hindsight-tls
  rules:
    - host: {{ include "aetherium.hindsightHost" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hindsight
                port:
                  name: http
