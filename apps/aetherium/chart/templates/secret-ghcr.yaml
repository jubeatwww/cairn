# Pulls the private images from ghcr.io (values.yaml, ghcr), for the server and the login Jobs it
# starts: both run as the ServiceAccount amt-server.
{{- $auth := printf "%s:%s" .Values.ghcr.username .Values.ghcr.token | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict "ghcr.io" (dict "auth" $auth)) | toJson | b64enc }}
