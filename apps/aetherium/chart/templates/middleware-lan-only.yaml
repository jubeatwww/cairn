# Traefik routes by Host header alone, so a host whose DNS points at a LAN IP is still reachable
# through the public IP. The LAN-only Ingresses in this namespace (hindsight's) attach it.
# Relies on Traefik seeing real client IPs (infrastructure/base/chart, traefik-helmchartconfig.yaml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: {{ .Release.Namespace }}
spec:
  ipAllowList:
    sourceRange:
      - {{ required "network.lanCidr is required (site.yaml)" .Values.network.lanCidr }}
