{{- if (.Values.infrastructure | default dict).monitoring }}
# Prometheus scrapes the server's task and collection metrics (infrastructure/monitoring brings
# the CRD).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: amt-server
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: amt-server
  endpoints:
    - port: metrics
      interval: 30s
{{- end }}
