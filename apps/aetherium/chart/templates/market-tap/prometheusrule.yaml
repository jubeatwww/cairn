{{- if (.Values.infrastructure | default dict).monitoring }}
# Alerts go to Discord with the rest (infrastructure/monitoring). A day missed is a day of quotes
# lost for good, hence a critical one for a silent collection.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: amt
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: amt
      rules:
        # A task run recorded as failed: a collection error, an upload that doesn't match, a stale
        # replay, an audit finding duplicates...
        - alert: AmtTaskFailed
          expr: increase(amt_task_runs_total{status="failed"}[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "amt task {{`{{ $labels.task }}`}} failed"
            description: "kubectl -n {{ .Release.Namespace }} logs deploy/amt-server, and amt.task_runs in Postgres."
        # Collecting, but no push received for 10 minutes: the subscription died silently. Pushes,
        # not rows written: the night session writes only the futures' open interest, which can go
        # quiet for 20 minutes while the feed is alive. Only while a collection runs, so holidays
        # stay quiet.
        - alert: AmtOrderbookSilent
          expr: >-
            (sum(rate(amt_ob_pushes_received_total[10m])) == 0 or absent(amt_ob_pushes_received_total))
            and on() (amt_ob_collection_active == 1)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "orderbook collection is live but silent"
            description: "The WebSocket session is likely dead or the feed stalled; quotes are being lost."
        # The stock books written during the session aren't reaching amt-collector (a file every 10
        # seconds): nothing is lost, the files stay and the upload after the session sends them, but
        # the readers don't see them yet. Usually amt-collector is down (its own alerts).
        - alert: AmtOrderbookCollectorBacklog
          expr: amt_ob_collector_pending_files > 6 and on() (amt_ob_collection_active == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{`{{ $value }}`}} stock book file(s) not taken by amt-collector"
            description: "kubectl -n {{ .Release.Namespace }} logs deploy/amt-server | grep 'ob→collector'"
        # The server is down, or its metrics endpoint is.
        - alert: AmtMetricsAbsent
          expr: absent(up{job="amt-server-metrics"}) or up{job="amt-server-metrics"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "amt-server's metrics are unreachable"
{{- end }}
