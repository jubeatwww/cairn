# What the login Job signs in with (site.secret.yaml): its environment (envFrom), and the TWCA
# certificate as a file. The session it gets goes to Secret amt-credentials-data, which the Job
# itself creates and updates, so it's not here.
apiVersion: v1
kind: Secret
metadata:
  name: amt-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  SINOTRADE_ID: {{ .Values.sinotrade.id | quote }}
  SINOTRADE_PASS: {{ .Values.sinotrade.password | quote }}
  twca-local-storage.json: {{ .Values.twcaLocalStorage | quote }}
