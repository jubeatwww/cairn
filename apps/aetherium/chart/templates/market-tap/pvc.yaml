apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: amt-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.data.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage.data.size }}
