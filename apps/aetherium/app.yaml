# Installed by apps.aetherium in site.yaml; its chart is chart/. Fields: README "Components and apps".
description: Aetherium's market-tap, collecting Taiwan stock and futures quotes into ClickHouse
# Postgres: market-tap's task log (schema amt). ClickHouse: the quotes. Both in its namespace, in its
# nightly backup. Its volume isn't: it only holds a day's quotes until they're uploaded.
database: {}
clickhouse: {}
# The ClickHouse schema Job waits for a fresh server.
timeout: 600
site:
  archivePath:
    comment: NFS export on nas.server for market-tap's monthly archive (Parquet, the ClickHouse partitions older than a year), mounted read-write.
    ask: market-tap 月封存（Parquet）在 NAS 上的 export 路徑
    example: /volume1/archive
    check: absPath
secrets:
  ghcr.token:
    comment: Pulls the private images from ghcr.io. A classic PAT with read:packages only.
    ask: ghcr.io 的 token（classic PAT，只勾 read:packages）
  sinotrade.id:
    comment: The SinoTrade account market-tap's login Job signs in with every trading morning.
    ask: SinoTrade 登入帳號
  sinotrade.password:
    comment: Its password.
    ask: SinoTrade 登入密碼
  sinotrade.apiKey:
    comment: The Shioaji API key amt-futures collects futures quotes with (SinoPac's API management page; quotes need no CA certificate).
    ask: Shioaji API Key
  sinotrade.secretKey:
    comment: Its secret key.
    ask: Shioaji Secret Key
  fubon.id:
    comment: The ID (身分證字號) amt-stock-trades signs in to Fubon's Neo API with.
    ask: 富邦 Neo API 登入的身分證字號
  fubon.apiKey:
    comment: Its API key, with market data permission only (Fubon's API key page).
    ask: 富邦 API Key（只開行情權限）
  fubon.certPassword:
    comment: The password of its certificate.
    ask: 富邦憑證密碼
  fubon.cert:
    comment: "Its certificate, the .pfx (valid for a year), base64. From the file: base64 < <cert>.pfx | scripts/secret.py set apps.<name>.fubon.cert"
    ask: 富邦憑證 .pfx 的 base64（改用 base64 < 憑證.pfx | scripts/secret.py set apps.<name>.fubon.cert）
  twcaLocalStorage:
    comment: "The TWCA certificate the login Job presents: the JSON market-tap's export-twca writes (twca-local-storage.json), private key included. From the file: scripts/secret.py set apps.<name>.twcaLocalStorage < twca-local-storage.json"
    ask: twca-local-storage.json 的內容（多行的話改用 scripts/secret.py set apps.<name>.twcaLocalStorage < 檔案）
