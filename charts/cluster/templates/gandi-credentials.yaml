{{- if has "gandi" (include "cluster.solversInUse" . | fromJsonArray) }}
{{- $gandi := .Values.gandi | default dict }}
# Read by cert-manager-webhook-gandi. Name and namespace are fixed: its chart only grants read access
# to cert-manager/gandi-credentials.
apiVersion: v1
kind: Secret
metadata:
  name: gandi-credentials
  namespace: cert-manager
type: Opaque
stringData:
  pat: {{ required "gandi.pat is required (site.secret.yaml) when a zone uses the gandi solver" $gandi.pat | quote }}
{{- end }}
