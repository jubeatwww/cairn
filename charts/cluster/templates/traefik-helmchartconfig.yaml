# Preserve client source IPs so ipAllowList middlewares see the real address.
# With the default (Cluster), kube-proxy masquerades external traffic to the LoadBalancer IP.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
