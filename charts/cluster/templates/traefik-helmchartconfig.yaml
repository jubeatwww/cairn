{{- /* Settings are documented in values.yaml (traefik). */ -}}
{{- $t := .Values.traefik }}
{{- $values := dict "service" (dict "spec" (dict "externalTrafficPolicy" $t.externalTrafficPolicy)) }}
{{- $ports := dict }}
{{- if $t.redirectToHttps }}
{{- $_ := set $ports "web" (dict "http" (dict "redirections" (dict "entryPoint" (dict "to" "websecure" "scheme" "https" "permanent" true)))) }}
{{- end }}
{{- with $t.readTimeout }}
{{- $_ := set $ports "websecure" (dict "transport" (dict "respondingTimeouts" (dict "readTimeout" .))) }}
{{- end }}
{{- if $ports }}{{ $_ := set $values "ports" $ports }}{{ end }}
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    {{- toYaml $values | nindent 4 }}
