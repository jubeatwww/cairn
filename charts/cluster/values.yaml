# Cluster-wide defaults. Site settings (acme.zones, acmeEmail) come from site.yaml at the repo root,
# secrets from site.secret.yaml (scripts/apply.sh).

# One ClusterIssuer per entry, named by the key. Ingresses pick one with
# cert-manager.io/cluster-issuer.
issuers:
  letsencrypt-staging: https://acme-staging-v02.api.letsencrypt.org/directory
  letsencrypt-prod: https://acme-v02.api.letsencrypt.org/directory

# Ways to prove control of a DNS zone, by name. site.yaml's acme.zones maps each zone to one of
# these, and acme.defaultSolver covers every other zone. Each value is a cert-manager ACME solver.
solvers:
  # DNS-01 through the Gandi LiveDNS API. Allows wildcards. Needs gandi.pat in site.secret.yaml.
  gandi:
    dns01:
      webhook:
        # Must match groupName in helm/cert-manager-webhook-gandi/values.yaml.
        groupName: acme.bwolf.me
        solverName: gandi
        config:
          patSecretRef:
            name: gandi-credentials
            key: pat
  # HTTP-01 through Traefik on port 80. For zones whose DNS has no API; the hostname must
  # already resolve to this node. No wildcards.
  http01:
    http01:
      ingress:
        ingressClassName: traefik

# StorageClass for volumes that keep growing (metrics, logs, Immich's thumbnails). Each volume is
# a logical volume of exactly its size, in the volume group lvm.volumeGroup (site.yaml), created by
# OpenEBS LVM LocalPV (helm/lvm-localpv). Writes past the size fail with "no space left" instead
# of filling the node's disk. Raise a PVC's size to grow it in place, while the group has room.
# k3s's default local-path stays for the small volumes: it neither caps nor reserves their size.
lvmStorageClass:
  name: lvm
  fsType: ext4
  # No blocks reserved for root (ext4 keeps 5% by default): these volumes hold app data only.
  formatOptions: "-m 0"

# k3s's bundled Traefik, set through a HelmChartConfig.
traefik:
  # Local keeps client source IPs, so ipAllowList middlewares see the real address.
  externalTrafficPolicy: Local
  # Redirect HTTP to HTTPS, every host. HTTP-01 still works: Let's Encrypt follows the redirect,
  # and cert-manager's challenge routers answer on HTTPS too (k3s turns TLS on for every router
  # on websecure). Don't lower the redirect's priority: Ingress routers also serve plain HTTP.
  redirectToHttps: true
  # Traefik v3 cuts request bodies off after 60s by default, too short for large uploads (Immich).
  readTimeout: 600s
