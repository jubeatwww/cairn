{{- $lanOnly := false }}
{{- range $_, $w := .Values.workloads }}
{{- if and $w.port (kindIs "map" $w.ingress) $w.ingress.lanOnly }}{{ $lanOnly = true }}{{ end }}
{{- end }}
{{- if $lanOnly }}
# Traefik routes by Host header alone, so a host whose DNS points at a LAN IP is still reachable
# through the public IP. The LAN-only Ingresses in this namespace attach it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: {{ .Release.Namespace }}
spec:
  ipAllowList:
    sourceRange:
      - {{ required "network.lanCidr is required (site.yaml)" (.Values.network | default dict).lanCidr }}
{{- end }}
