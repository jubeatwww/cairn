{{- with .Values.secrets }}
# From the app's entry in site.secret.yaml; workloads read them through secretEnv.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.secretName" $ }}
  namespace: {{ $.Release.Namespace }}
type: Opaque
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
