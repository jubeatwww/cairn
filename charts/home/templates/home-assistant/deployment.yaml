apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  # Two instances must never share one config volume and database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      # On the node's network so mDNS reaches the LAN: the iPhone finds the HomeKit Bridge (TCP 21064,
      # the first port HA picks for a UI-created bridge) and LAN discovery (e.g. Yeelight) works.
      # Needs ufw rules on the node, see README "Restore".
      hostNetwork: true
      # Still resolve cluster Services (mosquitto.<namespace>.svc.cluster.local) on the host network.
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        # Seed a fresh volume: the files configuration.yaml includes, as HA itself would create
        # them, and the reverse-proxy HTTP settings (see configmap.yaml). Never overwrites.
        - name: init-config
          image: {{ .Values.images.homeAssistant }}
          command:
            - sh
            - -c
            - |
              cd /config
              [ -e automations.yaml ] || echo '[]' > automations.yaml
              touch scripts.yaml scenes.yaml
              mkdir -p .storage
              [ -e .storage/http ] || cp /seed/http-storage.json .storage/http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /seed
      containers:
        - name: home-assistant
          image: {{ .Values.images.homeAssistant }}
          env:
            - name: TZ
              value: {{ required "timezone is required (site.yaml)" .Values.timezone }}
          ports:
            - name: http
              containerPort: 8123
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: configuration
          configMap:
            name: home-assistant
