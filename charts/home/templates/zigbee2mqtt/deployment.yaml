apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  # Only one process can hold the USB coordinator.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zigbee2mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zigbee2mqtt
    spec:
      containers:
        - name: zigbee2mqtt
          image: {{ .Values.images.zigbee2mqtt }}
          env:
            - name: TZ
              value: {{ required "timezone is required (site.yaml)" .Values.timezone }}
            # Skip the onboarding web UI. The first start writes configuration.yaml from the
            # settings below and generates a random network key, all kept in /app/data.
            - name: Z2M_ONBOARD_NO_SERVER
              value: "1"
            # These override configuration.yaml on every start.
            - name: ZIGBEE2MQTT_CONFIG_MQTT_SERVER
              value: mqtt://mosquitto.{{ .Release.Namespace }}.svc.cluster.local:1883
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_PORT
              value: /dev/zigbee
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER
              value: {{ required "zigbee.adapter is required (site.yaml)" .Values.zigbee.adapter }}
            - name: ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED
              value: "true"
            - name: ZIGBEE2MQTT_CONFIG_FRONTEND_PORT
              value: "8080"
            - name: ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            # Needed for access to the USB serial device.
            privileged: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: coordinator
              mountPath: /dev/zigbee
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
        - name: coordinator
          hostPath:
            path: {{ required "zigbee.device is required (site.yaml)" .Values.zigbee.device }}
            type: CharDevice
