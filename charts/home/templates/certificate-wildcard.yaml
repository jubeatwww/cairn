# One wildcard cert shared by the LAN-only hosts in this namespace,
# so their names stay out of public Certificate Transparency logs.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "home.wildcard" . }}
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ include "home.wildcard" . }}-tls
  dnsNames:
    - "*.{{ .Values.domain }}"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
