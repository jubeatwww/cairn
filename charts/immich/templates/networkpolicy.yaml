# The database and Valkey only serve Immich itself: nothing outside this namespace may reach them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-only
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - immich-postgres
          - immich-valkey
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
