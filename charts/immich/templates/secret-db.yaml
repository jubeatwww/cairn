{{- /* Generated once, then reused: the database keeps the password it was initialised with. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "immich-db" }}
apiVersion: v1
kind: Secret
metadata:
  name: immich-db
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ if $existing }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
