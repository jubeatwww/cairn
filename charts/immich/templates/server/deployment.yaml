apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
    spec:
      containers:
        - name: server
          image: {{ .Values.images.server }}
          env:
            - name: TZ
              value: {{ required "timezone is required (site.yaml)" .Values.timezone }}
            - name: DB_HOSTNAME
              value: immich-postgres
            {{- include "immich.dbEnv" . | nindent 12 }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
          ports:
            - name: http
              containerPort: 2283
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
          volumeMounts:
            - name: upload
              mountPath: /data
            # Add it in Immich as an external library with the import path /mnt/library.
            # Mounted read-write; the NAS export decides. It's read-only there, and opened only
            # for metadata edits (README "Immich").
            - name: library
              mountPath: /mnt/library
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: immich-upload
        - name: library
          nfs:
            server: {{ required "nas.server is required (site.yaml)" .Values.nas.server }}
            path: {{ required "immich.libraryPath is required (site.yaml)" .Values.immich.libraryPath }}
