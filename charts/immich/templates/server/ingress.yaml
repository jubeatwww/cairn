{{- if .Values.ingress }}
# Public, so shared albums work for people outside the LAN. Its own certificate: the name is public anyway.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.certIssuer }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ include "immich.host" . }}
      secretName: immich-tls
  rules:
    - host: {{ include "immich.host" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  name: http
{{- end }}
