{{- $discord := .Values.discord | default dict }}
# Where Alertmanager posts alerts (helm/kube-prometheus-stack, receiver discord).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.discordSecret.name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{ .Values.discordSecret.key }}: {{ required "discord.webhookUrl is required (site.secret.yaml): run scripts/setup-discord-alerts.sh" $discord.webhookUrl | quote }}
