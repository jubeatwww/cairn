# Chart defaults. Site settings (grafana.hostname, network.lanCidr) come from site.yaml, the Discord
# webhook from site.secret.yaml, both in the site directory (scripts/apply.sh). Its
# values/monitoring.yaml, if any, overrides these.

# ClusterIssuer for the Ingress certificate (charts/cluster, issuers).
certIssuer: letsencrypt-prod

# Grafana's Service, created by helm/kube-prometheus-stack (release kube-prometheus-stack).
grafanaService:
  name: kube-prometheus-stack-grafana
  port: 80

# The Secret holding the Discord webhook URL. Alertmanager mounts it and reads the key as a file:
# both must match helm/kube-prometheus-stack/values.yaml (alertmanagerSpec.secrets, webhook_url_file).
discordSecret:
  name: alertmanager-discord
  key: webhook-url
