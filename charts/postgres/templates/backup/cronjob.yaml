# Nightly pg_dump of the database to the NAS (site.yaml: nas.server, postgres.backupPath), as
# <backupPath>/<namespace>/YYYY-MM-DD.dump, kept for backup.keepDays (values.yaml). Custom format:
# compressed, and pg_restore can pick from it. Restore: scripts/restore-postgres.sh.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ required "timezone is required (site.yaml)" .Values.timezone }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # Root, like charts/home's backup: what it may write is up to the NAS export.
          securityContext:
            runAsUser: 0
          containers:
            - name: backup
              # The cluster's own image, so pg_dump matches the server's version.
              image: {{ include "postgres.image" . }}
              env:
                # POSIX form, so dates follow the site's timezone without tzdata.
                - name: TZ
                  value: {{ required "timezonePosix is required (site.yaml)" .Values.timezonePosix }}
                {{- include "postgres.pgEnv" . | trim | nindent 16 }}
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  {{- include "postgres.waitReady" . | nindent 18 }}
                  dest=/backup/{{ .Release.Namespace }}
                  file=$dest/$(date +%F).dump
                  mkdir -p "$dest"
                  pg_dump --format=custom --file="$file.partial"
                  mv "$file.partial" "$file"
                  find "$dest" -maxdepth 1 -name '20??-??-??.dump*' -mtime +{{ int .Values.backup.keepDays }} -delete
                  ls -l "$dest"
              volumeMounts:
                - name: nas
                  mountPath: /backup
          volumes:
            - name: nas
              nfs:
                {{- include "postgres.nas" . | nindent 16 }}
