{{- if (required "components is required (site.yaml)" .Values.components).monitoring }}
# Prometheus scrapes the instance's exporter (helm/kube-prometheus-stack picks up PodMonitors from
# every namespace, and brings their CRD). Grafana has CloudNativePG's dashboard (helm/cloudnative-pg).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
{{- end }}
