# Chart defaults. Installed once per namespace listed in site.yaml's postgres.clusters
# (scripts/apply.sh), which may override some of them per cluster; the NAS location comes from
# site.yaml too. Each release holds one CloudNativePG Cluster (helm/cloudnative-pg) named postgres:
# apps in that namespace connect to postgres-rw:5432 with the credentials in Secret postgres-app.

# PostgreSQL from CloudNativePG's image catalog. standard: with pgvector, pgaudit and all locales.
# site.yaml can pin one per cluster: postgres.clusters.<namespace>.image. A new major version
# upgrades the data in place, with downtime (README "Postgres").
image: ghcr.io/cloudnative-pg/postgresql:18.6-202610050823-standard-trixie

# Created on the first start, owned by the owner. CloudNativePG generates the owner's password.
database: app
owner: app

storage:
  # Per cluster in site.yaml: postgres.clusters.<namespace>.size. Grows online, never shrinks.
  size: 5Gi
  # Capped at its size (charts/cluster, lvmStorageClass).
  storageClass: lvm

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

backup:
  # Cron schedule, in site.yaml's timezone. After charts/home's backup at 04:00.
  schedule: "30 4 * * *"
  # Days of dumps kept on the NAS.
  keepDays: 14

# Namespaces allowed in through the NetworkPolicy, besides the cluster's own.
operatorNamespace: cnpg-system      # helm/cloudnative-pg: checks each instance's status
prometheusNamespace: monitoring     # helm/kube-prometheus-stack: scrapes the metrics

# Set only by scripts/restore-postgres.sh, which renders templates/backup/restore-job.yaml on its own.
restore:
  date: ""
  job: ""
