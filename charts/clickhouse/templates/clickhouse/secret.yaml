{{- /* The apps' credentials, as Secret postgres-app is for Postgres. The password is generated once,
       then reused: the server reads it from here on every start. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "clickhouse-app" }}
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-app
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ if $existing }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
stringData:
  username: {{ .Values.user }}
  database: {{ .Values.database }}
  host: clickhouse
  # HTTP; the native protocol is on 9000.
  port: "8123"
  url: http://clickhouse:8123
