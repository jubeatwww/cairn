# Only this namespace's apps reach the server. The operator and its exporter come from their own
# namespace, to the HTTP port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      clickhouse.altinity.com/chi: clickhouse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.operatorNamespace }}
      ports:
        - port: 8123
