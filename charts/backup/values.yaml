# Chart defaults. helmfile.yaml.gotmpl installs it as release backup in the namespace of each app
# or component that has something to back up, with name, volumes, database and clickhouse filled in
# from its backup: (app.yaml, component.yaml, or its entry in site.yaml, which can also override
# schedule and keepDays). The NAS location and the timezone come from site.yaml.
#
# Every night it writes <backup.path>/<name>/YYYY-MM-DD/ on the NAS:
#   <pvc>.tar.gz      one per volume
#   database.dump     pg_dump of the app's Postgres cluster, custom format (pg_restore can pick from it)
#   clickhouse-full/  the app's ClickHouse database (BACKUP), in full on Sundays
#   clickhouse-diff/  on the other nights, the parts that changed since the latest full one
# and deletes the days older than keepDays, except the full ClickHouse backup the kept nights build
# on. Restore: scripts/restore.sh <name> <YYYY-MM-DD>.

images:
  # bash, GNU tar, find.
  tools: debian:trixie-20260918-slim

# Cron schedule, in site.yaml's timezone.
schedule: "0 4 * * *"
# Days of backups kept on the NAS.
keepDays: 14

# The directory on the NAS, under backup.path: the app's or component's name.
name: ""
# PVC name: {exclude: [patterns], paths: [what to archive, relative to the volume's root]}. Without
# paths, the whole volume.
volumes: {}
# {image}: dump the Postgres cluster in this namespace (Secret postgres-app) with this image, the
# cluster's own, so pg_dump matches the server. Unset: no database.
database: null
# {image}: back up the ClickHouse server in this namespace (charts/clickhouse, Secret
# clickhouse-app) with this image's client, the server's own. Unset: no ClickHouse.
clickhouse: null

# Set only by scripts/restore.sh, which renders templates/restore-job.yaml on its own.
restore:
  date: ""
  job: ""
