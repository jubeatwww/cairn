# Chart defaults. helmfile.yaml.gotmpl installs it as release postgres in the namespace of each app
# with a database (site.yaml: apps.<name>.database, which may set size and image). Each release
# holds one CloudNativePG Cluster (infrastructure/postgres) named postgres: apps in that namespace
# connect to postgres-rw:5432 with the credentials in Secret postgres-app. The app's backup
# (charts/backup) dumps it every night.

# PostgreSQL from CloudNativePG's image catalog. standard: with pgvector, pgaudit and all locales.
# site.yaml can pin one per app: apps.<name>.database.image. A new major version upgrades the data in
# place, with downtime (README "Postgres").
image: ghcr.io/cloudnative-pg/postgresql:18.6-202610050823-standard-trixie

# Created on the first start, owned by the owner. CloudNativePG generates the owner's password.
database: app
owner: app

storage:
  # Per app in site.yaml: apps.<name>.database.size. Grows online, never shrinks.
  size: 5Gi
  # Capped at its size (infrastructure/base/chart, lvmStorageClass).
  storageClass: lvm

# The apps' databases are small: each instance stays near 100Mi (shared_buffers is 128MB).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Namespaces allowed in through the NetworkPolicy, besides the cluster's own.
operatorNamespace: cnpg-system      # infrastructure/postgres: checks each instance's status
prometheusNamespace: monitoring     # infrastructure/monitoring: scrapes the metrics
