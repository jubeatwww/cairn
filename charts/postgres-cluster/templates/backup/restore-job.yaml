{{- /* Rendered only by scripts/restore-postgres.sh (restore.date set), never by helm install/upgrade. */ -}}
{{- with .Values.restore.date }}
# Replaces the database's contents with that day's dump, in one transaction: if anything fails,
# the database is left as it was.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Values.restore.job | default (printf "postgres-restore-%s" .) }}
  namespace: {{ $.Release.Namespace }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restore
          image: {{ include "postgres.image" $ }}
          env:
            {{- include "postgres.pgEnv" $ | trim | nindent 12 }}
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              {{- include "postgres.waitReady" $ | nindent 14 }}
              dump=/backup/{{ $.Release.Namespace }}/{{ . }}.dump
              ls -l "$dump"
              pg_restore --clean --if-exists --no-owner --single-transaction --exit-on-error --dbname="$PGDATABASE" "$dump"
              echo "restored {{ . }}"
          volumeMounts:
            - name: nas
              mountPath: /backup
              readOnly: true
      volumes:
        - name: nas
          nfs:
            {{- include "postgres.nas" $ | nindent 12 }}
            readOnly: true
{{- end }}
