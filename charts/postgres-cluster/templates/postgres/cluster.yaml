# One instance: a single node has nowhere to put a replica.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  annotations:
    # Deleting the Cluster deletes its PVC, so uninstalling the release must leave it.
    helm.sh/resource-policy: keep
spec:
  instances: 1
  imageName: {{ include "postgres.image" . }}
  storage:
    size: {{ .Values.storage.size }}
    storageClass: {{ .Values.storage.storageClass }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  bootstrap:
    initdb:
      database: {{ .Values.database }}
      owner: {{ .Values.owner }}
